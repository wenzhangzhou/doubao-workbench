<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆包调度台 · 只读镜像</title>
<style>
body{background:#14100d;color:#f3e9dd;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:16px}
h1{font-size:20px} h2{font-size:16px;color:#ffb066;margin-top:28px}
.note{background:#2a1e14;border:1px solid #a35b17;border-radius:10px;padding:10px 12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#221a14;border:1px solid #3a2c20;border-radius:12px;padding:12px}
.card img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#3a2c20}
.badge{display:inline-block;background:#a35b17;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.thought{background:#2e241a;border-radius:10px;padding:6px 8px;font-size:13px;margin-top:6px}
.small{font-size:12px;color:#c9b8a3} .task{padding:6px 0;border-bottom:1px solid #2e241a;font-size:14px}
#canvasWrap{overflow:auto;background:#1b1511;border:1px solid #3a2c20;border-radius:12px;height:520px;position:relative}
#world{position:relative;transform-origin:0 0}
.node{position:absolute;width:220px;background:#26201a;border:1px solid #57402a;border-radius:10px;padding:8px;font-size:12px;cursor:pointer}
.node b{font-size:13px} #detail{background:#221a14;border:1px solid #3a2c20;border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:13px}
button{background:#a35b17;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
</style></head><body>
<h1>🐹 豆包调度台 · 只读镜像</h1>
<div class="note">只读镜像，数据以 Muse 内调度台为准。生成时间：2026-11-06T23:14:22+08:00 ｜ 概览：<span id="counts">{"projects": 5, "members": 38, "tasks": 15, "interactions": 54, "canvasNodes": 104}</span></div>
<h2>项目</h2><div class="cards" id="projects"></div>
<h2>成员</h2><div class="cards" id="members"></div>
<h2>流转</h2><div id="tasks"></div>
<h2>互动摘要（最近）</h2><div id="interactions"></div>
<h2>项目 #3 无限画布（只读）</h2>
<div><button onclick="zoom(1.2)">放大</button> <button onclick="zoom(0.8)">缩小</button> <button onclick="zoom(0,true)">复位</button>
<span class="small">点节点看详情；画布以调度台本体为准，镜像为快照渲染。</span></div>
<div id="canvasWrap"><div id="world"><svg id="edges" style="position:absolute;left:0;top:0;overflow:visible"></svg></div></div>
<div id="detail">点一个节点，这里显示它的全部元信息。</div>
<script>
const STATUS={todo:"待分配",doing:"进行中",blocked:"已阻塞",done:"已完成"};
let scale=0.32;
fetch("data.json").then(r=>r.json()).then(d=>{
  document.getElementById("projects").innerHTML=d.projects.map(p=>
    `<div class="card"><b>${p.name}</b> <span class="badge">${p.status}</span><div class="small">负责人 ${p.owner} · 成员 ${p.memberCount} · 流转 ${p.flowCount} · #${p.id}</div><div>${p.nextStep||""}</div></div>`).join("");
  const dot=s=>{s=s||"";if(s.startsWith("工作中")||s.startsWith("调度中"))return "#ff8c1a";if(s.startsWith("已完成"))return "#39c463";if(s.startsWith("已阻塞"))return "#e5484d";return "#999"};
  document.getElementById("members").innerHTML=d.members.map(m=>
    `<div class="card"><img src="${m.avatarData||("avatars/"+m.avatar+".jpg")}" onerror="this.style.display='none'"><b>${m.name}</b> <span class="small">${m.role} · 项目#${m.projectId}</span><div><span class="dot" style="background:${dot(m.liveStatus)}"></span>${m.liveStatus||""}</div>${m.innerThought?`<div class="thought">💭 ${m.innerThought}</div>`:""}<div class="small">✅ ${m.canDo||""}</div><div class="small">🚫 ${m.cannotDo||""}</div></div>`).join("");
  document.getElementById("tasks").innerHTML=d.tasks.map(t=>
    `<div class="task"><b>${t.title}</b> <span class="badge">${STATUS[t.status]||t.status}</span><div class="small">${t.project} · ${t.dispatcher} → ${t.assignee}</div><div class="small">${t.criteria||""}</div></div>`).join("");
  document.getElementById("interactions").innerHTML=d.interactions.slice().reverse().map(i=>
    `<div class="task"><span class="badge">${i.type}</span> ${i.fromName} → ${i.toName}<div class="small">${i.content}</div></div>`).join("");
  const world=document.getElementById("world"), svg=document.getElementById("edges");
  const byId={}; d.canvas.nodes.forEach(n=>byId[n.id]=n);
  let maxX=0,maxY=0;
  d.canvas.nodes.forEach(n=>{maxX=Math.max(maxX,n.x+240);maxY=Math.max(maxY,n.y+140);
    const el=document.createElement("div");el.className="node";el.style.left=n.x+"px";el.style.top=n.y+"px";
    el.innerHTML=`<b>${n.title}</b><div class="small">${n.nodeType} · 第${n.shotNo}镜 · ${n.owner} · ${n.status}</div>`;
    el.onclick=()=>{document.getElementById("detail").textContent=n.title+"\n"+JSON.stringify(JSON.parse(n.meta||"{}"),null,2)};
    world.appendChild(el);});
  world.style.width=maxX+"px";world.style.height=maxY+"px";svg.setAttribute("width",maxX);svg.setAttribute("height",maxY);
  svg.innerHTML=d.canvas.edges.map(e=>{const a=byId[e.fromNodeId],b=byId[e.toNodeId];if(!a||!b)return "";
    return `<line x1="${a.x+220}" y1="${a.y+40}" x2="${b.x}" y2="${b.y+40}" stroke="#a35b17" stroke-width="2"/>`}).join("");
  applyZoom();
});
function applyZoom(){document.getElementById("world").style.transform=`scale(${scale})`}
function zoom(f,reset){scale=reset?0.32:Math.min(1.5,Math.max(0.1,scale*f));applyZoom()}
</script></body></html>
